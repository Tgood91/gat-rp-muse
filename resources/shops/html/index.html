<!DOCTYPE html>
<!-- ============================================================
     LESSON 20: the shop window (NUI page).
     This page is a MENU, not a shop: it holds no prices,
     no stock, no gold of its own. The server builds a
     menu table and the client hands it over; this page
     only DRAWS it and posts clicks back ("buy" / "close").
     Edit prices here and nothing changes — that's the
     point. The server is the shop; this is the glass.
     ============================================================ -->
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box;
      font-family: 'Segoe UI', Arial, sans-serif; }
  body { display: none; }
  body.open { display: block; }
  #panel {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 540px; background: #0d1526;
    border: 2px solid #c9a227; border-radius: 10px;
    color: #e8e4d8; padding: 18px 20px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, .6);
  }
  header {
    display: flex; justify-content: space-between;
    align-items: baseline; border-bottom: 1px solid #c9a227;
    padding-bottom: 10px; margin-bottom: 6px;
  }
  h1 { font-size: 22px; color: #c9a227; letter-spacing: 1px; }
  #gold { font-size: 16px; color: #ffd94d; }
  .row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 4px; border-bottom: 1px solid #22304d;
  }
  .row:last-child { border-bottom: none; }
  .info { flex: 1; }
  .label { font-size: 16px; }
  .detail { font-size: 12px; color: #9fb0cc; }
  .stock { font-size: 12px; color: #9fb0cc; width: 62px; text-align: right; }
  .price { width: 76px; text-align: right; color: #ffd94d; }
  input.qty {
    width: 56px; background: #16223c; color: #fff;
    border: 1px solid #33477a; border-radius: 4px;
    padding: 5px; text-align: center;
  }
  button.buy {
    background: #c9a227; color: #0d1526; border: none;
    border-radius: 4px; padding: 6px 14px;
    font-weight: bold; cursor: pointer;
  }
  button.buy:hover { background: #e3ba35; }
  button.buy:disabled { background: #555; color: #999; cursor: default; }
  #closeBtn {
    margin-top: 12px; width: 100%; background: none;
    border: 1px solid #33477a; color: #9fb0cc;
    border-radius: 4px; padding: 6px; cursor: pointer;
  }
</style>
</head>
<body>
<div id="panel">
  <header><h1 id="vendor">Shop</h1><div id="gold"></div></header>
  <div id="rows"></div>
  <button id="closeBtn">Close (Esc)</button>
</div>
<script>
  // FiveM tells the page its resource name; the fallback
  // keeps the page testable in a plain browser.
  const resName = window.GetParentResourceName
    ? window.GetParentResourceName() : 'shops';
  let currentVendor = null;

  // Send a message back to client.lua (RegisterNUICallback).
  function post(name, data) {
    fetch('https://' + resName + '/' + name, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json; charset=UTF-8' },
      body: JSON.stringify(data || {})
    });
  }

  function closeMenu() {
    document.body.classList.remove('open');
    post('close', {});
  }

  // Draw one menu the server sent. After every buy the
  // server sends a FRESH menu, so gold and stock update
  // in the window — this function just draws it again.
  function render(menu) {
    currentVendor = menu.vendorKey;
    document.getElementById('vendor').textContent = menu.vendor;
    document.getElementById('gold').textContent = menu.gold + ' gold';
    const rows = document.getElementById('rows');
    rows.innerHTML = '';
    menu.items.forEach(function (item) {
      const row = document.createElement('div');
      row.className = 'row';
      const def = (item.kind === 'ammo' || item.kind === 'fuel') ? 20 : 1;
      row.innerHTML =
        '<div class="info"><div class="label"></div>' +
        '<div class="detail"></div></div>' +
        '<div class="stock"></div><div class="price"></div>' +
        '<input class="qty" type="number" min="1" value="' + def + '">' +
        '<button class="buy">Buy</button>';
      row.querySelector('.label').textContent = item.label;
      row.querySelector('.detail').textContent = item.detail;
      row.querySelector('.stock').textContent = 'Stock: ' + item.stock;
      row.querySelector('.price').textContent = item.price + ' gold';
      const btn = row.querySelector('.buy');
      if (item.stock <= 0) { btn.disabled = true; btn.textContent = 'Out'; }
      btn.addEventListener('click', function () {
        const amount = parseInt(row.querySelector('.qty').value, 10) || def;
        post('buy', {
          vendorKey: currentVendor, kind: item.kind,
          key: item.key, amount: amount
        });
      });
      rows.appendChild(row);
    });
    document.body.classList.add('open');
  }

  // Messages from client.lua (SendNUIMessage) land here.
  window.addEventListener('message', function (e) {
    if (e.data.action === 'open') { render(e.data.menu); }
    if (e.data.action === 'close') {
      document.body.classList.remove('open');
    }
  });

  document.getElementById('closeBtn').addEventListener('click', closeMenu);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeMenu(); }
  });
</script>
</body>
</html>
